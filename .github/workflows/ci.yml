---
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限（zizmor 加固：CI 只需读仓库，无写/凭据操作）
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # README 测试数与实测一致性门禁（D-079 纪律——防漂移复发）
      - run: node scripts/check-readme-tests.cjs
      # 自扫描健康检查：工具必须能扫描自身且拓扑输出正常。
      # 注意不用 --strict——CLI/loader/extractor 自身处理 io 属正常，strict 留给消费者项目
      - run: node dist/cli.js scan src --no-cache --topology > /dev/null
      # 库 API 冒烟：require 可加载
      - run: node -e "require('./dist/index.js')"
